<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مكتبتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style id="css">
/* Layout: sticky shop bar (with a staff-only row), short hero with 3 steps, product grid with filters, then an order panel that ends in a WhatsApp button. Look: stationery desk, ink blue with a highlighter-yellow accent, ruled-paper tiles. */
:root{
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --fg:#18202E;
  --muted:#566277;
  --line:#D9DEE7;
  --tint:#E9EEF7;
  --rule:rgba(31,58,107,.11);
  --ink:#1F3A6B;
  --ink-fg:#FFFFFF;
  --hl:#FFD84D;
  --hl-fg:#18202E;
  --mark:#FFE88A;
  --wa:#0B7A4B;
  --wa-fg:#FFFFFF;
  --danger:#B3261E;
  --font-display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141C;--surface:#181E29;--fg:#E7ECF4;--muted:#9BA6BA;--line:#2A3344;--tint:#1F2735;
    --rule:rgba(157,184,242,.12);--ink:#9DB8F2;--ink-fg:#0E1524;--hl:#FFD84D;--hl-fg:#18202E;
    --mark:rgba(255,216,77,.30);--wa:#2BC673;--wa-fg:#052414;--danger:#FF8A80;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141C;--surface:#181E29;--fg:#E7ECF4;--muted:#9BA6BA;--line:#2A3344;--tint:#1F2735;
  --rule:rgba(157,184,242,.12);--ink:#9DB8F2;--ink-fg:#0E1524;--hl:#FFD84D;--hl-fg:#18202E;
  --mark:rgba(255,216,77,.30);--wa:#2BC673;--wa-fg:#052414;--danger:#FF8A80;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;direction:rtl;text-align:start}
body.has-cart{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shop bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.45rem;color:var(--ink);min-width:0}
.brand-mark{flex:none;width:32px;height:32px;border-radius:8px;background:var(--hl);color:var(--hl-fg);display:grid;place-items:center}
.brand-mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer}
.pill b{min-width:24px;height:24px;border-radius:99px;background:var(--ink);color:var(--ink-fg);display:inline-grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}

/* staff row (only built for people who can edit the page) */
.admwrap{background:var(--tint);border-top:1px solid var(--line)}
.adm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px}
.badge{background:var(--hl);color:var(--hl-fg);padding:2px 10px;border-radius:99px;font-weight:600;font-size:.82rem}
.admmsg{flex:1 1 140px;min-width:0;color:var(--muted);font-size:.84rem}
.sm{padding:5px 12px;min-height:36px;font-size:.88rem}

/* hero */
.hero{position:relative;padding-block:30px 6px}
.hero-grid{position:relative;z-index:1;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:820px){.hero-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px}}
.hero-art{width:100%;max-width:280px;height:auto;margin-inline:auto;display:block;filter:drop-shadow(0 16px 14px rgba(0,0,0,.14))}
@media (min-width:820px){.hero-art{max-width:340px}}
.hero-art .a-line{fill:var(--line)}
.hero-art .a-surf{fill:var(--surface)}
.hero-art .a-tint{fill:var(--tint)}
.hero-art .a-ink{fill:var(--ink)}
.hero-art .a-inkS{stroke:var(--ink);fill:none}
.hero-art .a-hl{fill:var(--hl)}
.hero-art .a-pg{fill:#F4F1E8}
.hero-art .a-sp{stroke:rgba(255,255,255,.35);fill:none}
.hero-art .a-fine{stroke:var(--rule);fill:none}
.doodles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.doodles svg{position:absolute;width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.1}
@media (prefers-reduced-motion:no-preference){
  .doodles svg{animation:floaty 8s ease-in-out infinite}
  .doodles svg:nth-child(2n){animation-duration:10s;animation-delay:-3s}
  .doodles svg:nth-child(3n){animation-duration:12s;animation-delay:-6s}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(calc(var(--r,0deg) + 6deg))}}
  .hero-art .bob{animation:bob 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes bob{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.5deg)}}
}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,5.4vw,2.6rem);line-height:1.4;text-wrap:balance;max-width:22em;color:var(--fg)}
.mark{background:linear-gradient(transparent 56%,var(--mark) 56% 94%,transparent 94%);padding-inline:.12em}
.hero p{margin-top:12px;color:var(--muted);max-width:36em}
.steps{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:1fr}
.steps li{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums}
@media (min-width:600px){.steps{grid-template-columns:repeat(3,auto);justify-content:start;gap:28px}}

/* theme toggle */
.bactions{display:flex;align-items:center;gap:8px;flex:none}
.theme{position:relative;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;overflow:hidden;padding:0}
.theme svg{grid-area:1/1;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .i-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
.theme .i-moon{opacity:1;transform:none}
:root[data-theme="dark"] .theme .i-sun{opacity:1;transform:none}
:root[data-theme="dark"] .theme .i-moon{opacity:0;transform:rotate(90deg) scale(.4)}
@media (prefers-reduced-motion:no-preference){
  .theme svg{transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .5s ease}
  html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .6s ease,color .6s ease,border-color .6s ease,fill .6s ease,stroke .6s ease,box-shadow .6s ease,opacity .6s ease!important}
}

/* groups by stage */
.gh{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--ink);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.gh small{font-family:var(--font-body);font-size:.8rem;font-weight:500;background:var(--tint);color:var(--muted);padding:1px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.gh::after{content:"";flex:1;height:0;border-top:2px dashed var(--line)}
.grp:first-child .gh{margin-top:6px}

/* payment */
.paynums{display:grid;gap:8px;margin-top:10px}
.payr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.payr label{display:flex;align-items:center;gap:8px;flex:1 1 120px;min-width:0;font-weight:500;overflow-wrap:anywhere}
.field .payr input[type="radio"]{width:auto;min-height:0;padding:0;border:0;box-shadow:none;accent-color:var(--ink)}
.payr .num{flex:0 1 auto;overflow-wrap:anywhere}
.paynote{color:var(--muted);font-size:.88rem;margin-top:8px}
.pbadge{display:inline-block;font-size:.78rem;font-weight:600;padding:0 8px;border-radius:99px;background:var(--tint);color:var(--ink)}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-block:26px 16px}
.search{flex:1 1 220px;min-width:0}
.field input,.field textarea,.field select,.search input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;min-height:44px}
.field input[type="file"]{padding:8px}
.field input[type="checkbox"]{width:auto;min-height:0}
.field input:focus,.field textarea:focus,.field select:focus,.search input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--rule)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:500;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}

/* products */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr))}
@media (min-width:760px){.grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cover{position:relative;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden}
.cover svg{width:42%;max-width:80px;height:auto;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cover.book{background:linear-gradient(135deg,var(--c1),var(--c2));color:rgba(255,255,255,.92)}
.cover.book::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:15%;width:2px;background:rgba(255,255,255,.28)}
.cover.has-img::after{display:none}
.cover.book.has-img,.cover.tool.has-img{background:var(--tint)}
.cover.tool{background-color:var(--tint);background-image:repeating-linear-gradient(to bottom,transparent 0 21px,var(--rule) 21px 22px);color:var(--ink)}
.kind{position:absolute;z-index:1;top:8px;inset-inline-end:8px;font-size:.72rem;font-weight:500;padding:1px 9px;border-radius:99px;background:var(--surface);color:var(--muted)}
.book:not(.has-img) .kind{background:rgba(255,255,255,.2);color:#fff}
.kind.soldout{inset-inline-end:auto;inset-inline-start:8px;background:var(--fg);color:var(--bg)}
.card.out .cover svg,.card.out .cover img{opacity:.5}
.cbody{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.cbody h3{font-size:1rem;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.cbody .sub{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.crow{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-weight:600;background:var(--mark);padding:1px 9px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbox{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.was{color:var(--muted);text-decoration:line-through;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.off{position:absolute;z-index:1;bottom:8px;inset-inline-start:8px;font-size:.78rem;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--hl);color:var(--hl-fg)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.empty{grid-column:1/-1;padding:28px 8px;color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:10px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--ink-fg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.step{display:inline-flex;align-items:center;direction:ltr;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.step button{width:38px;height:38px;border:0;background:transparent;color:var(--ink);font-size:1.2rem;font-weight:600;cursor:pointer}
.step span{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* editor panels */
.edit{margin-top:22px}
.edit .panel{border-color:var(--ink)}
fieldset.field{border:0;padding:0;margin:0;min-width:0}
legend.lbl{padding:0;margin-bottom:6px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw label{position:relative;display:block}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{display:block;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
.sw input:checked + span{outline:3px solid var(--ink);outline-offset:2px}
.sw input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
.imgprev{display:flex;align-items:center;gap:10px}
.imgprev img{width:84px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* order */
.order{margin-top:40px;padding-block:30px 48px;border-top:1px solid var(--line)}
.order h2{font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin-bottom:18px}
.og{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.og{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{font-size:1.05rem;font-weight:600;margin-bottom:12px}
.lines{list-style:none;margin:0;padding:0;display:grid}
.line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line .nm{flex:1 1 150px;min-width:0}
.line .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.line .nm small{color:var(--muted)}
.line .lt{font-variant-numeric:tabular-nums;font-weight:600;min-width:72px;text-align:end}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;font-size:.85rem;text-decoration:underline}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-weight:600}
.sum strong{font-size:1.4rem;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.86rem;margin-top:4px}
.none{color:var(--muted);padding-block:6px}
form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-weight:500;font-size:.92rem}
.field input[dir="ltr"]{text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;font-weight:500;background:var(--bg)}
.seg input:checked + span{border-color:var(--ink);background:var(--ink);color:var(--ink-fg)}
.seg input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:6px;padding:14px;border-radius:12px;background:var(--wa);color:var(--wa-fg);font-weight:600;font-size:1.05rem;text-decoration:none}
.wa svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.err{color:var(--danger);font-weight:500;min-height:1.5em;margin-top:8px}
.after{color:var(--muted);font-size:.9rem;margin-top:6px}
details{margin-top:12px}
summary{cursor:pointer;font-weight:500;color:var(--ink)}
.prev{width:100%;margin-top:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.7;resize:vertical}
.copyrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:.9rem}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all;color:var(--fg);font-weight:500}
.foot{padding-block:8px 28px;color:var(--muted);font-size:.88rem}

/* whatsapp contacts: customer picker and staff editor */
.pick{display:grid;gap:8px}
.pick label{position:relative;display:block}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500;background:var(--bg);overflow-wrap:anywhere}
.pick input:checked + span{border-color:var(--ink);background:var(--ink);color:var(--ink-fg)}
.pick input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
.clist{display:grid;gap:10px}
.cedit{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cedit .x{justify-self:start;padding:2px 4px}

/* entry screen: customer or staff */
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate-box{width:100%;max-width:400px;display:grid;gap:18px;justify-items:center;text-align:center}
.gate-mark{width:64px;height:64px;border-radius:18px;background:var(--hl);color:var(--hl-fg);display:grid;place-items:center}
.gate-mark svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gate-t{font-family:var(--font-display);font-weight:700;font-size:1.7rem;line-height:1.4;text-wrap:balance;color:var(--fg)}
.gate-p{color:var(--muted)}
.gate-step{width:100%;display:grid;gap:12px}
.gate-step .field{text-align:start}
.btn.big{min-height:54px;font-size:1.1rem;border-radius:14px;width:100%}

/* bottom bar */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1080px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-in div{min-width:0;font-variant-numeric:tabular-nums}
.bar-in small{display:block;color:var(--muted);line-height:1.3}
.bar-in strong{font-size:1.15rem}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.pill{transition:background-color .15s,color .15s}}

/* ===== polish: backgrounds, depth, calm motion ===== */
:root{--glow:rgba(255,216,77,.26);--glow2:rgba(31,58,107,.10)}
:root[data-theme="dark"]{--glow:rgba(255,216,77,.07);--glow2:rgba(157,184,242,.11)}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:22px 22px}
main{position:relative;isolation:isolate}
main::before{content:"";position:absolute;z-index:-1;inset:0 0 auto 0;height:640px;pointer-events:none;background:radial-gradient(520px 320px at 92% 0,var(--glow),transparent 70%),radial-gradient(520px 360px at 4% 18%,var(--glow2),transparent 70%)}
.card{box-shadow:0 1px 0 var(--line),0 14px 26px -22px rgba(24,32,46,.5)}
.panel{box-shadow:0 14px 28px -24px rgba(24,32,46,.45)}
.top{box-shadow:0 8px 18px -16px rgba(24,32,46,.35)}
.strip{display:flex;align-items:center;gap:10px;margin-block:26px 0;color:var(--ink);opacity:.55}
.strip svg{flex:none;width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.strip i{flex:1;min-width:8px;border-top:2px dashed var(--line)}
.order h2 .mark{padding-inline:.25em}

/* entry screen */
.gate{background:radial-gradient(640px 420px at 85% -5%,var(--glow),transparent 70%),radial-gradient(560px 420px at 0% 105%,var(--glow2),transparent 70%),radial-gradient(var(--rule) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
.gate-box{position:relative;z-index:1;gap:14px}
.gate .doodles svg{width:56px;height:56px;opacity:.13}
.gate-art{width:min(100%,300px);height:auto;filter:drop-shadow(0 16px 14px rgba(0,0,0,.14))}
.gate-sub{color:var(--muted);max-width:25em}
.gate-theme{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:2}
.gate.out{opacity:0;pointer-events:none}

@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes barin{from{transform:translateY(100%)}to{transform:none}}
  .btn,.chip,.pill,.theme{transition:background-color .3s ease,color .3s ease,border-color .3s ease,transform .3s ease,box-shadow .3s ease}
  .btn:active,.chip:active,.pill:active{transform:scale(.97)}
  .card{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease}
  .cover svg{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .brand-mark{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .gate{transition:opacity .45s ease}
  @media (hover:hover){
    .card:hover{transform:translateY(-4px);box-shadow:0 1px 0 var(--line),0 22px 30px -22px rgba(24,32,46,.55)}
    .card:hover .cover svg{transform:scale(1.08) rotate(-3deg)}
    .chip:hover{border-color:var(--ink)}
    .brand:hover .brand-mark{transform:rotate(-8deg)}
    .theme:hover{transform:rotate(14deg)}
  }
  .hero-grid>div{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
  .hero-grid .hero-art{animation:fade 1.4s ease .25s backwards}
  .steps li{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
  .steps li:nth-child(1){animation-delay:.35s}.steps li:nth-child(2){animation-delay:.45s}.steps li:nth-child(3){animation-delay:.55s}
  .strip{animation:fade 1.4s ease .5s backwards}
  #grid.anim .card{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
  #grid.anim .gh{animation:fade .7s ease backwards}
  .edit .panel{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
  .bar:not([hidden]){animation:barin .5s cubic-bezier(.2,.7,.2,1) backwards}
  .gate-box>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
  .gate-box>:nth-child(2){animation-delay:.1s}.gate-box>:nth-child(3){animation-delay:.18s}.gate-box>:nth-child(4){animation-delay:.26s}.gate-box>:nth-child(5){animation-delay:.34s}
}

  function loadScript(url){
    return new Promise(function(res, rej){

  async function getPdfLib(){
    if(pdfLib) return pdfLib;
    var base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await loadScript(base + 'pdf.min.js');
    var lib = window.pdfjsLib;
    if(!lib) throw new Error('nolib');
    try{
      var wr = await fetch(base + 'pdf.worker.min.js');
      var wt = await wr.text();
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([wt], { type: 'text/javascript' }));
    }catch(e){ lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; }
    pdfLib = lib;
    return lib;
  }
  async function pdfToDataUrl(file){
    var lib = await getPdfLib();
    var doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    var page = await doc.getPage(1);
    var v0 = page.getViewport({ scale: 1 });
    var v = page.getViewport({ scale: 640 / Math.max(v0.width, v0.height) });
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(v.width)); c.height = Math.max(1, Math.round(v.height));
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: v }).promise;
    return c.toDataURL('image/jpeg', 0.8);
  }

  function fileToDataUrl(file, cb){
    var fr = new FileReader();
    fr.onerror = function(){ cb(null); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ cb(null); };
      im.onload = function(){
        var s = Math.min(1, 640 / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.78));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function cyrb53(str){
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(var i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }

      else if(d.adm === 'discard'){ draft = null; dirty = false; $('#editor').hidden = true; $('#settings').hidden = true; refreshAll(); }
    }
    else if(isAdmin && d.edit) openEditor(d.edit);
    else if(isAdmin && d.stock){
      startDraft();
      var p = null, l = draft.products;
      for(var i = 0; i < l.length; i++){ if(l[i].id === d.stock) p = l[i]; }
      if(p){ p.out = !p.out; markDirty(); }
    }
    else if(isAdmin && d.pdel){
      if(b.dataset.armed){
        startDraft();
        draft.products = draft.products.filter(function(x){ return x.id !== d.pdel; });
        markDirty();
      } else {
        b.dataset.armed = '1'; b.textContent = 'اضغط تاني للحذف';
        setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; b.textContent = 'حذف'; } }, 3000);
      }
    }
    else if(isAdmin && d.rmimg){ edImg = ''; renderImgPrev(); }
    else if(isAdmin && d.cadd){
      $('#cList').insertAdjacentHTML('beforeend', contactRow(null));
      var ls = document.querySelectorAll('#cList .c-label'); if(ls.length) ls[ls.length - 1].focus();
    }
    else if(isAdmin && d.crm){ var row = b.closest('.cedit'); if(row) row.remove(); }
    else if(isAdmin && d.yadd){
      $('#yList').insertAdjacentHTML('beforeend', payRow(null));
      var ys = document.querySelectorAll('#yList .y-val'); if(ys.length) ys[ys.length - 1].focus();
    }
    else if(isAdmin && d.yrm){ var yrow = b.closest('.cedit'); if(yrow) yrow.remove(); }
  });

  /* forms: some previews (sandboxed frames) block native form submission, so submit buttons and Enter are handled by hand */
  function fireSubmit(form){ form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); }
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('button');
    if(b && b.type === 'submit' && b.form){ e.preventDefault(); if(!b.disabled) fireSubmit(b.form); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.isComposing) return;
    var t = e.target;
    if(t && t.tagName === 'INPUT' && t.form && t.type !== 'submit' && t.type !== 'button'){ e.preventDefault(); fireSubmit(t.form); }
  });

  function boot(){
    $('#app').innerHTML = SHELL;
    applyTheme(curTheme());
    $('#doodles').innerHTML = doodlesHTML(); $('#gateDoodles').innerHTML = doodlesHTML();
    document.querySelectorAll('[data-tb]').forEach(function(b){ b.addEventListener('click', toggleTheme); });
    $('#strip').innerHTML = ['pen','ruler','book','highlighter','notebook','pencil'].map(function(k){ return glyph(k); }).join('<i></i>');
    $('#payBox').addEventListener('change', function(e){
      var nmv = e.target.name;
      if(nmv === 'pay'){ selPay = e.target.value; lsSet('maktabti-pay', selPay); }
      else if(nmv === 'paynum'){ selPayNum = e.target.value; lsSet('maktabti-paynum', selPayNum); }
      else return;
      renderPay(); updateLink();
      var ck = document.querySelector(nmv === 'pay' ? '#payOpts input:checked' : '#payNums input:checked');
      if(ck) ck.focus({ preventScroll: true });
    });
    $('#cf').addEventListener('submit', function(e){ e.preventDefault(); if(isAdmin) changeCode(); });
    $('#ccancel').addEventListener('click', function(){ $('#codePanel').hidden = true; });

    var sw = '';
    COVERS.forEach(function(c, i){
      sw += '<label><input type="radio" name="pcolor" value="' + i + '" aria-label="لون ' + (i + 1) + '"' + (i === 0 ? ' checked' : '') + '><span style="--c1:' + c[0] + ';--c2:' + c[1] + '"></span></label>';
    });
    $('#sw').innerHTML = sw;
    $('#pglyph').innerHTML = GLYPH_LABELS.filter(function(g){ return g[0] !== 'book'; }).map(function(g){ return '<option value="' + g[0] + '">' + g[1] + '</option>'; }).join('');

    var saved = lsGet('maktabti-form');
    if(saved){
      $('#name').value = saved.name || ''; $('#phone').value = saved.phone || '';
      $('#addr').value = saved.addr || ''; $('#notes').value = saved.notes || '';
      var r = document.querySelector('input[name="method"][value="' + (saved.method === 'pickup' ? 'pickup' : 'delivery') + '"]');
      if(r) r.checked = true;
    }

    $('#q').addEventListener('input', function(e){ query = e.target.value; renderGrid(); });
    $('#cartPill').addEventListener('click', function(){ scrollTo('#order'); });
    $('#barGo').addEventListener('click', function(){ scrollTo('#order'); });

    function syncMethod(){ $('#addrField').hidden = !form().delivery; updateLink(); }
    function saveForm(){
      var f = form();
      lsSet('maktabti-form', { name: f.name, phone: $('#phone').value, addr: f.addr, notes: f.notes, method: f.delivery ? 'delivery' : 'pickup' });
    }
    $('#form').addEventListener('input', function(){ $('#err').textContent = ''; saveForm(); updateLink(); });
    $('#form').addEventListener('change', function(){ saveForm(); syncMethod(); });
    $('#form').addEventListener('submit', function(e){ e.preventDefault(); });

    $('#wa').addEventListener('click', function(e){
      var pr = problem();
      $('#after').hidden = true;
      if(pr){
        e.preventDefault();
        $('#err').textContent = pr.msg;
        var el = pr.focus ? $(pr.focus) : null; if(el) el.focus();
        return;
      }
      $('#err').textContent = '';
      updateLink();
      this.href = $('#wa').href;
      var after = $('#after');
      if(waPrefilled){
        after.textContent = 'اتفتح واتساب والرسالة جاهزة. اضغط إرسال هناك عشان الطلب يوصل.';
      } else {
        after.textContent = 'اتفتح واتساب. الرابط ده ما بيكتبش الرسالة لوحده، فانسخها من "راجع الرسالة" والصقها وابعتها.';
        try{ navigator.clipboard.writeText($('#prev').value).then(function(){
          after.textContent = 'اتفتح واتساب والرسالة اتنسخت. الصقها في المحادثة وابعتها.';
        }, function(){}); }catch(err){}
      }
      after.hidden = false;
    });
    $('#contactOpts').addEventListener('change', function(e){
      selContact = e.target.value; lsSet('maktabti-contact', selContact);
      renderMeta(); updateLink();
    });

    $('#copy').addEventListener('click', function(){
      var ta = $('#prev'), out = $('#copied');
      function fallback(){ ta.focus(); ta.select(); out.textContent = 'حدّد الرسالة وانسخها يدويًا.'; }
      updateLink();
      try{ navigator.clipboard.writeText(ta.value).then(function(){ out.textContent = 'اتنسخت.'; }, fallback); }catch(err){ fallback(); }
    });

    /* staff-only forms: harmless for customers, the panels stay hidden and publishing is refused by the server */
    document.querySelectorAll('input[name="pcat"]').forEach(function(r){ r.addEventListener('change', syncKind); });
    $('#pf').addEventListener('submit', function(e){ e.preventDefault(); if(isAdmin) saveProduct(); });
    $('#pcancel').addEventListener('click', function(){ $('#editor').hidden = true; });
    $('#pprice').addEventListener('input', updDisc);
    $('#pdisc').addEventListener('input', updDisc);
    $('#sf').addEventListener('submit', function(e){ e.preventDefault(); if(isAdmin) saveSettings(); });
    $('#scancel').addEventListener('click', function(){ $('#settings').hidden = true; });
    $('#pimg').addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      $('#perr').textContent = '';
      var msg = $('#pimgMsg'), isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      function got(url){
        msg.textContent = PIMG_HINT;
        if(!url){ $('#perr').textContent = isPdf ? 'ما قدرناش نقرأ ملف الـ PDF ده. جرّب ملف تاني أو صورة.' : 'الصورة مش مقروءة. جرّب صورة تانية.'; return; }
        edImg = url; renderImgPrev();
      }
      if(isPdf){
        msg.textContent = 'جاري تجهيز الصورة من الـ PDF...';
        pdfToDataUrl(f).then(got, function(){ got(null); });
      } else {
        fileToDataUrl(f, got);
      }
    });

    $('#gateStep2').addEventListener('submit', async function(e){
      e.preventDefault();
      if(!CONFIGURED){ $('#gerr').textContent = 'المتجر لسه ما اتربطش بقاعدة البيانات. كمّل خطوات الإعداد.'; return; }
      $('#gerr').textContent = 'جاري التحقق...';
      var sbtn = $('#gateStep2 button[type=submit]'); sbtn.disabled = true;
      var res;
      try{ res = await signIn($('#gcode').value.trim()); }catch(x){ res = { ok: false, net: true, timeout: !!(x && x.name === 'AbortError') }; }
      sbtn.disabled = false;
      if(!res.ok){ $('#gerr').textContent = authMsg(res); $('#gcode').select(); return; }
      $('#gerr').textContent = '';
      staffOK = true;
      try{ sessionStorage.removeItem('maktabti-role'); }catch(x){}
      closeGate(); applyStaff();
    });

    syncMethod();
    refreshAll();
    if(staffOK || sessRole() === 'customer') closeGate(); else openGate();

    if(staffOK) applyStaff();
    loadRemote();
  }

  boot();
})();
</script>
</body>
</html>
